# vps-panel-host:{{ server_name }}
server {
    listen 80{% if default_server %} default_server{% endif %};
    listen [::]:80{% if default_server %} default_server{% endif %};
    server_name {{ server_name }};

    # nginx defaults to 1m, which silently caps every panel POST. 25m is
    # generous for forms and config edits; /api/files/upload overrides it.
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root {{ acme_webroot }};
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    {% if ssl_enabled %}
    # To the panel's name, not $host: a visit by IP lands on the name the
    # certificate is for.
    location / {
        return 301 https://{{ server_name }}$request_uri;
    }
    {% else %}
    include /etc/nginx/vps-panel-access.conf;

{{ peer_location }}
    # Drive/Files uploads — see the 443 block below for why these two
    # directives differ from the rest of the panel.
    location = /api/files/upload {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 5g;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    {% endif %}
}

{% if ssl_enabled %}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {{ server_name }};

    ssl_certificate {{ cert_path }};
    ssl_certificate_key {{ key_path }};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # nginx defaults to 1m, which silently caps every panel POST. 25m is
    # generous for forms and config edits; /api/files/upload overrides it.
    client_max_body_size 25m;

    include /etc/nginx/vps-panel-access.conf;

{{ peer_location }}
    # Drive/Files uploads. Two things differ from the rest of the panel:
    #
    #   client_max_body_size    matches the agent's 5 GiB per-file ceiling.
    #                           Without it nginx answers 413 and then STOPS
    #                           READING the request, so the browser stalls
    #                           pushing bytes at a socket nobody drains — the
    #                           upload appears to hang rather than fail.
    #   proxy_request_buffering nginx otherwise spools the whole body to disk
    #                           before the panel sees a byte, which defeats the
    #                           streaming path (browser → panel → agent → disk)
    #                           and needs 5 GiB of scratch space to do it.
    location = /api/files/upload {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 5g;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
{% endif %}
